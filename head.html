<style id="ol-tmdb-style">
  .ol-tmdb-button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--hope-colors-primary9, #1677ff);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition:
      background-color 0.15s ease,
      color 0.15s ease,
      transform 0.15s ease;
  }

  .ol-tmdb-button-wrap {
    position: relative;
    display: inline-flex;
  }

  .ol-tmdb-tip {
    position: absolute;
    right: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--hope-colors-neutral12, #1f1f1f);
    color: var(--hope-colors-neutral1, #fff);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }

  .ol-tmdb-tip::after {
    content: "";
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-left-color: var(--hope-colors-neutral12, #1f1f1f);
  }

  .ol-tmdb-button-wrap:hover .ol-tmdb-tip {
    opacity: 1;
  }

  .ol-tmdb-button:hover {
    background: var(--hope-colors-primary9, #1677ff);
    color: #fff;
  }

  .ol-tmdb-button:active {
    transform: scale(0.94);
  }

  .ol-tmdb-mask {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .ol-tmdb-mask[data-open="true"] {
    display: flex;
  }

  .ol-tmdb-modal {
    width: min(980px, 100%);
    max-height: min(760px, calc(100vh - 40px));
    overflow: hidden;
    background: var(--hope-colors-neutral1, #fff);
    color: var(--hope-colors-neutral12, #1f1f1f);
    border-radius: 8px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .ol-tmdb-header,
  .ol-tmdb-footer {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--hope-colors-neutral5, #e8e8e8);
  }

  .ol-tmdb-footer {
    border-top: 1px solid var(--hope-colors-neutral5, #e8e8e8);
    border-bottom: 0;
  }

  .ol-tmdb-title {
    margin: 0;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 650;
  }

  .ol-tmdb-body {
    overflow: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .ol-tmdb-panel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ol-tmdb-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ol-tmdb-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ol-tmdb-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--hope-colors-neutral11, #555);
  }

  .ol-tmdb-input,
  .ol-tmdb-select {
    width: 100%;
    min-height: 34px;
    border: 1px solid var(--hope-colors-neutral6, #d9d9d9);
    border-radius: 6px;
    background: var(--hope-colors-neutral1, #fff);
    color: inherit;
    padding: 7px 10px;
    font: inherit;
  }

  .ol-tmdb-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    user-select: none;
  }

  .ol-tmdb-mode-fields[data-mode="movie"] .ol-tmdb-tv-only,
  .ol-tmdb-mode-fields[data-mode="tv"] .ol-tmdb-movie-only {
    display: none;
  }

  .ol-tmdb-list {
    border: 1px solid var(--hope-colors-neutral5, #e8e8e8);
    border-radius: 8px;
    overflow: hidden;
  }

  .ol-tmdb-list-head,
  .ol-tmdb-file,
  .ol-tmdb-result {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 9px 10px;
    border-bottom: 1px solid var(--hope-colors-neutral5, #e8e8e8);
  }

  .ol-tmdb-list-head {
    grid-template-columns: 30px 1fr 92px;
    font-size: 12px;
    font-weight: 650;
    color: var(--hope-colors-neutral11, #555);
    background: var(--hope-colors-neutral2, #fafafa);
  }

  .ol-tmdb-file {
    grid-template-columns: 30px 1fr 92px;
  }

  .ol-tmdb-result {
    grid-template-columns: 68px 1fr auto;
    cursor: pointer;
  }

  .ol-tmdb-file:last-child,
  .ol-tmdb-result:last-child {
    border-bottom: 0;
  }

  .ol-tmdb-file[data-selected="true"],
  .ol-tmdb-result[data-selected="true"] {
    background: color-mix(in srgb, var(--hope-colors-primary9, #1677ff) 11%, transparent);
  }

  .ol-tmdb-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }

  .ol-tmdb-meta {
    color: var(--hope-colors-neutral10, #777);
    font-size: 12px;
  }

  .ol-tmdb-poster {
    width: 54px;
    height: 80px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--hope-colors-neutral4, #eee);
  }

  .ol-tmdb-preview {
    min-height: 94px;
    border: 1px solid var(--hope-colors-neutral5, #e8e8e8);
    border-radius: 8px;
    padding: 10px;
    background: var(--hope-colors-neutral2, #fafafa);
    font-size: 13px;
    display: grid;
    gap: 8px;
  }

  .ol-tmdb-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
  }

  .ol-tmdb-status {
    min-height: 20px;
    font-size: 13px;
    color: var(--hope-colors-neutral11, #555);
  }

  .ol-tmdb-status[data-kind="error"] {
    color: var(--hope-colors-danger9, #d4380d);
  }

  .ol-tmdb-status[data-kind="ok"] {
    color: var(--hope-colors-success9, #237804);
  }

  .ol-tmdb-action {
    border: 1px solid var(--hope-colors-neutral6, #d9d9d9);
    border-radius: 6px;
    background: var(--hope-colors-neutral1, #fff);
    color: inherit;
    min-height: 34px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }

  .ol-tmdb-action[data-primary="true"] {
    border-color: var(--hope-colors-primary9, #1677ff);
    background: var(--hope-colors-primary9, #1677ff);
    color: #fff;
  }

  .ol-tmdb-action:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  @media (max-width: 760px) {
    .ol-tmdb-body {
      grid-template-columns: 1fr;
    }
  }
</style>
